{% if page.yt_id or page.gh_url %}
<div class="callout-cards">
  {% if page.yt_id %}
  <a class="callout-card" href="https://youtu.be/{{ page.yt_id }}">
    <div class="callout-kicker callout-kicker--accent">▶ Watch</div>
    <div class="callout-title">The video companion</div>
    <div class="callout-url">youtu.be/{{ page.yt_id }}</div>
  </a>
  {% endif %}

  {% if page.gh_url %}
  <a class="callout-card" href="{{ page.gh_url }}">
    <div class="callout-kicker">&lt;/&gt; Code</div>
    <div class="callout-title">Runnable code on GitHub</div>
    <div class="callout-url">{{ page.gh_url | remove: "https://" }}</div>
  </a>
  {% endif %}
</div>
{% endif %}
