{% if page.previous or page.next %}
<nav class="page-prev-next">
  {% if page.previous %}
  <a href="{{ page.previous.url | relative_url }}">
    <span class="ppn-label">← Prev</span>
    <span class="ppn-title">{{ page.previous.title }}</span>
  </a>
  {% endif %}

  {% if page.next %}
  <a class="ppn-next" href="{{ page.next.url | relative_url }}">
    <span class="ppn-label">Next →</span>
    <span class="ppn-title">{{ page.next.title }}</span>
  </a>
  {% endif %}
</nav>
{% endif %}
