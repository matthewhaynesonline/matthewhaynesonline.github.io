<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}" data-bs-theme="auto">
  {% include html_head.html %}
  <body>
    {% include header.html %}

    <div class="page-frame">
      <div class="listing-header">
        <h1>{{ page.title | escape }}</h1>
        {% if page.dek %}
        <p class="listing-dek">{{ page.dek }}</p>
        {% endif %}
      </div>

      {{ content }}

      {% include page_prev_next.html %}
    </div>

    {% include footer.html %}
  </body>
</html>
